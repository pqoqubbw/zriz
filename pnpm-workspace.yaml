packages:
  - packages/*
  - apps/*
  - test/react18

catalog:
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  typescript: 7.0.2
  vitest: 5.0.5
  "@vitest/browser-playwright": 5.0.5
  playwright: 1.64.1
  tsdown: 0.23.3
  publint: 0.3.25
  "@arethetypeswrong/cli": 0.18.5
  size-limit: 14.3.0
  "@size-limit/preset-small-lib": 14.3.0

minimumReleaseAge: 1440

allowBuilds:
  esbuild: false

strictDepBuilds: true

blockExoticSubdeps: true

trustPolicy: no-downgrade

engineStrict: true

packageManagerStrictVersion: true
