name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every lockfile entry comes from the registry with an integrity hash
        run: |
          test "$(grep -c 'resolution:' pnpm-lock.yaml)" = "$(grep -c 'resolution: {integrity: sha512-' pnpm-lock.yaml)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build:packages
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm type
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm check
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm lint:package

  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm exec vitest run --project '!* (chromium)' --project '!* (firefox)' --project '!* (webkit)'

  browser:
    name: browser (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      ENGINE: ${{ matrix.engine }}
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: install the browser
        run: |
          args=("$ENGINE")
          if [ "$ENGINE" = chromium ]; then args+=(--only-shell); fi
          pnpm exec playwright install "${args[@]}"
      - run: pnpm exec vitest run --project "* ($ENGINE)"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.engine }}
          path: |
            .vitest/attachments
            **/__screenshots__
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build:packages
      - name: measure the head
        run: |
          mkdir -p "$RUNNER_TEMP/size/head"
          for dir in packages/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && pnpm exec size-limit --json > "$RUNNER_TEMP/size/head/$name.json") || true
          done
      - name: measure the base
        id: base
        continue-on-error: true
        run: |
          sha="$(git rev-parse HEAD^1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$RUNNER_TEMP/base" "$sha"
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile --prefer-offline
          pnpm build:packages
          mkdir -p "$RUNNER_TEMP/size/base"
          for dir in packages/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && pnpm exec size-limit --json > "$RUNNER_TEMP/size/base/$name.json") || true
          done
      - name: report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: node scripts/size-report.ts "$RUNNER_TEMP/size/base" "$RUNNER_TEMP/size/head" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm size

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter docs build

  ci:
    if: ${{ always() }}
    needs: [static, unit, browser, size, docs]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done
