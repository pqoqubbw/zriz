name: Feature request
description: Propose a new prop, part or behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        zriz keeps a small API and no runtime dependencies. Start with the problem. We can work out the API together.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The product or screen you are building, and where zriz gets in the way.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today?
      description: Your current workaround, if you have one.
  - type: textarea
    id: proposal
    attributes:
      label: What would you like zriz to do?
      description: Optional. A sketch of the prop or part you have in mind.
  - type: textarea
    id: prompt
    attributes:
      label: Fix prompt
      description: Optional. If you know how to build it, write the prompt you would give a coding agent instead of a pull request. Name the files, the change, the test that proves it and what must not change. CONTRIBUTING.md has an example.
    validations:
      required: false
