<div
  id="zoom"
  data-zriz-item="zoom"
  role="slider"
  tabindex="0"
  aria-label="Zoom"
  style="
    position: relative;
    width: 200px;
    height: 24px;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  "
>
  <div
    id="thumb"
    data-zriz-item="zoom-thumb"
    style="
      top: 4px;
      width: 16px;
      height: 16px;
      border-radius: 8px;
      background: currentColor;
      translate: -50%;
    "
  ></div>
</div>
